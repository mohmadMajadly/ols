services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # خدمة التتبع الصوتي الآني (WP9c) — WebSocket داخلي فقط (بلا منفذ للمضيف)،
  # يخاطبها الـbackend حصراً عبر ASR_URL. faster-whisper (CTranslate2 INT8)
  # على CPU بنموذج tarteel-ai/whisper-base-ar-quran، يُحوَّل مرة واحدة عند
  # أول إقلاع إلى volume asr_models (قد يستغرق دقائق أول مرة — start_period
  # يمنح مهلة كافية قبل اعتبار الحاوية غير سليمة).
  asr:
    build: ./asr
    restart: unless-stopped
    volumes:
      - asr_models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # عنوان WS داخلي لخدمة asr — شبكة compose فقط (WP9c)
      ASR_URL: ws://asr:8090
    volumes:
      - ./backend:/app
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      asr:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # بوابة HTTPS للتطوير (شهادة ذاتية) — تتيح الميكروفون من أجهزة الشبكة:
  # https://<IP الجهاز>:5174 — انظر dev/Caddyfile
  https-dev:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
    ports:
      - "5174:5174"
    depends_on:
      - frontend

volumes:
  pgdata:
  frontend_node_modules:
  media:
  caddy_dev_data:
  asr_models:
