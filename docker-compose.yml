services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # بوابة HTTPS للتطوير (شهادة ذاتية) — تتيح الميكروفون من أجهزة الشبكة:
  # https://<IP الجهاز>:5174 — انظر dev/Caddyfile
  https-dev:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
    ports:
      - "5174:5174"
    depends_on:
      - frontend

volumes:
  pgdata:
  frontend_node_modules:
  media:
  caddy_dev_data:
